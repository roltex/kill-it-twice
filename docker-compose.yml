# Kill It Twice — local stack
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optio
      POSTGRES_PASSWORD: optio
      POSTGRES_DB: optio
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optio -d optio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: optio
      RABBITMQ_DEFAULT_PASS: optio
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: ./apps/pipeline
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://optio:optio@postgres:5432/optio
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_URL: amqp://optio:optio@rabbitmq:5672
      BATCH_SIZE: "500"
      MAX_IN_FLIGHT: "2"
      BACKOFF_START_MS: "1000"
      BACKOFF_CAP_MS: "15000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: ./apps/consumer
    environment:
      DATABASE_URL: postgres://optio:optio@postgres:5432/optio
      RABBITMQ_URL: amqp://optio:optio@rabbitmq:5672
      QUEUE_NAME: optio.changes
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pipeline:
        condition: service_started
    restart: unless-stopped

  ui:
    build:
      context: ./apps/ui
    ports:
      - "4200:80"
    depends_on:
      - pipeline

volumes:
  pgdata:
